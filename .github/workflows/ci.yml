# Generated file: it is rewritten whenever this set is re-published, so edits
# here do not survive. Packages live in packages/<name>, the bootstrap is
# tools/toolchain.py and the tool pin is toolchain.lock.json.
# The pinned toolchain is downloaded from a PUBLIC release, so the workflow
# token is enough: no secret and no self-hosted runner.
# MANUAL RUNS ONLY: the pinned toolchain release is not available yet, so
# an automatic run would fail for a reason that has nothing to do with
# these packages. It switches to push runs once the release is out.
name: packages
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package:
          - unidroit.picc
          - unidroit.picc_formation
          - unidroit.picc_limitation
          - unidroit.picc_non_performance
          - unidroit.picc_obligations
          - unidroit.picc_performance
          - unidroit.picc_validity
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch the pinned toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/toolchain.py download --lock toolchain.lock.json --out "$RUNNER_TEMP/law-tools-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Build the package; run its scenarios, replay and rebuild
        run: |
          tools="$RUNNER_TEMP/law-tools-${{ github.run_id }}-${{ github.run_attempt }}"
          python3 "$tools/package.py" "packages/${{ matrix.package }}" --lawc "$tools/law-cli" --offline --out "$RUNNER_TEMP/release-${{ github.run_id }}-${{ github.run_attempt }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.package }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
