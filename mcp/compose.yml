# Local MCP over the packages of this repository (offline: nothing leaves
# the machine). The image carries this slice of the canon, the engine and no
# sources of the oracle; the pin it must match is mcp/pin.json.
services:
  mcp:
    image: ghcr.io/arxohq/arxo-mcp-picc@sha256:c4c083c14c92125af201ab87ea8127ceb1acb08533da682ffc3c6b9dc05e7332
    platform: linux/amd64
    ports:
      # Loopback only: the server listens on its own 0.0.0.0 inside the
      # container, and the port is not exposed beyond this host.
      - "127.0.0.1:8722:8722"
    environment:
      LAW_MCP_HOST: 0.0.0.0
      LAW_MCP_PORT: "8722"
    read_only: true
    restart: unless-stopped
